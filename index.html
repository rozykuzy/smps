<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SMPS</title>
<meta name="description" content="12주 리컴프 — 3분할 운동 · 식단 로그">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B0B0C">
<meta name="color-scheme" content="dark light">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SMPS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B0B0C'/%3E%3Ccircle cx='32' cy='32' r='15' fill='none' stroke='%23D9FF3F' stroke-width='11'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<style>
:root{
  --bg:#0B0B0C;--bg2:#141415;--bg3:#1D1D1F;--bg-a:rgba(11,11,12,.93);
  --ink:#F4F3EE;--ink2:rgba(244,243,238,.62);--ink3:rgba(244,243,238,.36);
  --line:rgba(244,243,238,.1);--line2:rgba(244,243,238,.2);
  --volt:#D9FF3F;--on-volt:#0B0B0C;--acc:#D9FF3F;--warn:#FF6A45;--go:#D9FF3F;--slow:#F2C14E;
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","Segoe UI",Roboto,system-ui,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",SFMono-Regular,"Roboto Mono",Menlo,Consolas,monospace;
  --pad:20px;--nav:62px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
[data-theme="light"]{
  --bg:#F2F1EC;--bg2:#E8E6DF;--bg3:#DDDBD2;--bg-a:rgba(242,241,236,.93);
  --ink:#0B0B0C;--ink2:rgba(11,11,12,.62);--ink3:rgba(11,11,12,.38);
  --line:rgba(11,11,12,.11);--line2:rgba(11,11,12,.24);
  --acc:#0B0B0C;--warn:#D4421B;--go:#4C8A00;--slow:#A87400;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
html.lock,html.lock body{overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;font-weight:450;letter-spacing:-.012em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;min-height:100vh;min-height:100dvh;overscroll-behavior-y:none;font-variant-numeric:tabular-nums;word-break:keep-all;overflow-wrap:anywhere;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;letter-spacing:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;text-align:inherit}
button:disabled{opacity:.25;cursor:default}
input,textarea{font:inherit;color:inherit;letter-spacing:inherit;border:0;outline:0;background:none;border-radius:0;-webkit-appearance:none;appearance:none;min-width:0;-webkit-user-select:text;user-select:text}
a{color:inherit;text-decoration:none}
ul,ol{list-style:none}
svg{display:block;flex:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input:focus-visible,textarea:focus-visible{outline:0}
h1,h2,h3{font-weight:700;letter-spacing:-.04em;line-height:1.05}
b{font-weight:650}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:500;line-height:1.35}
.dim{color:var(--ink2)}.faint{color:var(--ink3)}.sm{font-size:13px}

/* ---------- shell ---------- */
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;padding-bottom:calc(var(--nav) + var(--sab) + 96px)}
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;height:calc(52px + var(--sat));padding:var(--sat) var(--pad) 0;background:var(--bg-a);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px)}
.brand{font-weight:800;font-size:15px;letter-spacing:.02em;height:44px;display:flex;align-items:center}
.brand i{font-style:normal;color:var(--acc);margin:0 2px}
.brand em{font-style:normal;color:var(--ink2);font-weight:700;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
[data-theme="light"] .brand i{color:var(--ink3)}
#top-meta{height:28px;padding:0 11px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line2);color:var(--ink2);display:flex;align-items:center;gap:6px}
#top-meta.live{background:var(--volt);color:var(--on-volt);box-shadow:none;font-weight:600;letter-spacing:.02em}
#top-meta.live::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;animation:blink 1.2s infinite}
#view{display:block}
#view.enter{animation:rise .3s var(--ease)}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg-a);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--line);padding-bottom:var(--sab)}
#nav>div{max-width:520px;margin:0 auto;height:var(--nav);display:grid;grid-template-columns:repeat(5,1fr)}
#nav button{position:relative;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;font-weight:500;color:var(--ink3);transition:color .2s}
#nav button::before{content:"";position:absolute;top:-1px;left:50%;width:22px;height:2px;margin-left:-11px;background:var(--acc);transform:scaleX(0);transition:transform .25s var(--ease)}
#nav button.on{color:var(--ink)}
#nav button.on::before{transform:scaleX(1)}
#toast{position:fixed;left:50%;top:calc(var(--sat) + 62px);z-index:90;transform:translate(-50%,-12px);max-width:min(88vw,460px);background:var(--ink);color:var(--bg);font-size:13.5px;font-weight:600;line-height:1.4;padding:10px 16px;border-radius:18px;opacity:0;pointer-events:none;transition:opacity .2s,transform .25s var(--ease);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- hero / page headers ---------- */
.hero{padding:10px var(--pad) 0}
.hero-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:30px}
.hero-num{font-size:clamp(84px,27vw,124px);font-weight:600;letter-spacing:-.065em;line-height:.84;margin:10px 0 18px -5px}
.hero-num i{font-style:normal;color:var(--acc);margin:0 -.02em}
[data-theme="light"] .hero-num i{color:var(--ink3)}
.hero-sub{font-size:15px;color:var(--ink2);font-weight:500}
.hero-sub em{font-style:normal;color:var(--ink);font-weight:650;margin-left:4px}
.day-nav{display:flex;align-items:center;gap:2px;margin-right:-8px}
.day-nav button{min-width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--ink2);padding:0 6px}
.day-nav svg{width:20px;height:20px}
.weeks{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:16px}
.weeks i{height:3px;border-radius:2px;background:var(--line2)}
.weeks i.done{background:var(--ink)}.weeks i.now{background:var(--acc)}
.chip{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line2);font-size:12.5px;font-weight:600;white-space:nowrap;color:var(--ink2)}
.hero .chip,.day .chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;height:26px;padding:0 10px;font-weight:500}
.chip.volt{background:var(--volt);color:var(--on-volt);box-shadow:none}
.page-h{padding:10px var(--pad) 0}
.page-h h1{font-size:56px;letter-spacing:-.055em;line-height:1;margin:8px 0 12px -2px}
.page-h h1 small{font-size:20px;font-weight:600;letter-spacing:-.03em;color:var(--ink2)}
.page-h p{font-size:15px;max-width:34em}
.warn{margin:18px var(--pad) 0;padding:12px 14px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--warn);color:var(--warn);font-size:13px;line-height:1.5}

/* ---------- sections ---------- */
.sec{padding:0 var(--pad);margin-top:40px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line);min-height:32px}
.sec-h+.cta,.sec-h+.card,.sec-h+.big-num,.sec-h+.day,.sec-h+.wk,.sec-h+.hm,.sec-h+.guards,.sec-h+.chips,.sec-h+.light{margin-top:16px}
.dots{display:flex;align-items:center;gap:5px}
.dots i{width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line2)}
.dots i.on{background:var(--acc);box-shadow:none}
.dots em{font-style:normal;margin-left:6px}
.note{font-size:13.5px;line-height:1.6;color:var(--ink2);margin-top:14px}
.note.box{margin:18px var(--pad) 0;padding:14px 16px;background:var(--bg2);border-radius:16px}
.empty{padding:22px 0 4px;color:var(--ink3);font-size:14px}

/* ---------- cards ---------- */
.cta{display:flex;flex-direction:column;width:100%;min-height:208px;padding:18px 18px 16px;border-radius:26px;background:var(--volt);color:var(--on-volt);transition:transform .15s var(--ease)}
.cta:active{transform:scale(.985)}
.cta-top{display:flex;justify-content:space-between;gap:10px;opacity:.72}
.cta-title{font-size:46px;font-weight:700;letter-spacing:-.055em;line-height:1;margin-top:auto;padding-top:28px}
.cta-title small{font-size:19px;font-weight:600;letter-spacing:-.03em;opacity:.55}
.cta-list{font-size:13.5px;font-weight:500;opacity:.7;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cta-bot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:14px;font-size:13.5px;font-weight:600}
.cta-go{width:46px;height:46px;border-radius:50%;background:var(--on-volt);color:var(--volt);display:flex;align-items:center;justify-content:center}
.cta.live{background:var(--bg2);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--volt);min-height:164px}
.cta.live .cta-go{background:var(--volt);color:var(--on-volt)}
.card{display:flex;flex-direction:column;width:100%;padding:18px;border-radius:26px;background:var(--bg2);gap:6px}
.card+.card{margin-top:10px}
.card.ghost{background:none;box-shadow:inset 0 0 0 1px var(--line2)}
.card.slim{padding:16px 18px}
.card-top{display:flex;align-items:center;justify-content:space-between;min-height:28px}
.card-title{font-size:30px;font-weight:700;letter-spacing:-.045em;line-height:1.1;margin-top:10px}
.card-p{font-size:14.5px;color:var(--ink2);line-height:1.55}
.card-p b{color:var(--ink)}
.stats{display:flex;gap:22px;margin-top:12px;flex-wrap:wrap}
.stats>span{display:flex;flex-direction:column;gap:1px;min-width:0}
.stats b{font-size:27px;font-weight:600;letter-spacing:-.04em;line-height:1.1}
.stats b em{font-style:normal;color:var(--ink3);font-size:.6em;letter-spacing:-.02em}
.stats small{font-size:11.5px;color:var(--ink2);white-space:nowrap}
.stats.big{gap:28px;margin-top:18px}.stats.big b{font-size:44px}
.stats.line{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
.stats.line b{font-size:21px}
.sub-acts{display:flex;justify-content:space-between;gap:12px;margin-top:6px}
.sub-acts{align-items:center;margin-top:10px}
.sub-acts button{font-size:13px;font-weight:600;color:var(--ink2);height:40px}
.sub-acts .seg button{height:28px}
.sub-acts.in{margin-top:8px}.sub-acts.in button{color:var(--ink);text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--line2)}
.tick{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line2);display:flex;align-items:center;justify-content:center;color:transparent;flex:none;transition:background .15s,box-shadow .15s}
.tick svg{width:16px;height:16px;stroke-width:2.4}
.tick.on,.on>.tick{background:var(--volt);box-shadow:none;color:var(--on-volt)}
.tick.on svg,.on>.tick svg{animation:pop .25s var(--ease)}
.tick.big{width:48px;height:48px;border-radius:14px;color:var(--ink3)}
.tick.big svg{width:22px;height:22px;stroke-width:2}
.tick.big.on{color:var(--on-volt)}
.score{font-family:var(--mono);font-size:15px;font-weight:600;min-width:34px;height:34px;padding:0 8px;border-radius:10px;background:var(--volt);color:var(--on-volt);display:inline-flex;align-items:center;justify-content:center}
.coach{display:flex;flex-direction:column;width:100%;margin-top:14px;padding:14px 16px 16px;border-radius:20px;background:var(--bg2)}
.coach .stats{gap:18px;margin-top:8px}.coach .stats b{font-size:22px}

/* ---------- rows ---------- */
.rows>li+li{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:62px;padding:12px 0}
.row-at{width:42px;flex:none;color:var(--ink2);display:flex;align-items:center}
.row-at svg{width:20px;height:20px}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row-main b{font-size:15.5px;line-height:1.35}
.row-main small{font-size:13px;color:var(--ink2);line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row.meal:not(.has) .row-main small{color:var(--ink3)}
.row.meal.has .row-main small{color:var(--ink)}
.row-end{width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--ink3);flex:none}
.row-end svg{width:20px;height:20px}
.row-end.ok{color:var(--acc)}
.row-val{font-size:22px;font-weight:600;letter-spacing:-.035em;display:flex;align-items:baseline;gap:5px;white-space:nowrap}
.row-val small{font-size:12px;font-weight:500;color:var(--ink2);letter-spacing:0}
.row.sel .row-main b{color:var(--acc)}
.row.prep.on .row-main{opacity:.45}.row.prep.on .row-main b{text-decoration:line-through}
.thumb{width:42px;height:42px;border-radius:10px;object-fit:cover;flex:none;background:var(--bg3)}
.thumb.gone{display:none}
.spark{width:60px;height:18px;flex:none}
.spark polyline{fill:none;stroke:var(--acc);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.cups{display:flex;gap:4px}
.cup{width:15px;height:26px;border-radius:5px;box-shadow:inset 0 0 0 1.5px var(--line2);transition:background .15s}
.cup.on{background:var(--ink);box-shadow:none}
.guards{display:grid;gap:8px;margin-bottom:8px}
.guard{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border-radius:16px;box-shadow:inset 0 0 0 1px var(--line2)}
.guard>span:last-child{display:flex;flex-direction:column;min-width:0}
.guard b{font-size:14.5px}.guard small{font-size:12.5px;color:var(--ink2);line-height:1.45}
.guard.on{background:var(--bg2);box-shadow:none}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 20px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:15px;font-weight:650;white-space:nowrap;width:100%;transition:transform .12s var(--ease),opacity .15s}
.btn:active{transform:scale(.975)}
.btn svg{width:20px;height:20px}
.btn.volt{background:var(--volt);color:var(--on-volt)}
.btn.ghost{background:none;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.btn.danger{background:var(--warn);color:#0B0B0C}
.btn.danger-t{color:var(--warn);box-shadow:none}
.btn.xl{height:60px;font-size:17px}
.btn.file{position:relative;overflow:hidden;cursor:pointer;margin-top:12px}
.btn.file input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.btn-row{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px;margin-top:16px}
.btn-row .btn.file{margin-top:0}
.btn-col{display:grid;gap:8px;margin-top:20px}
.mini{height:34px;padding:0 14px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:650;flex:none}
.seg{display:inline-flex;background:var(--bg2);border-radius:999px;padding:3px;flex:none}
.seg button{height:28px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:650;color:var(--ink2);white-space:nowrap}
.seg button.on{background:var(--ink);color:var(--bg)}

/* ---------- train ---------- */
.day{border-bottom:1px solid var(--line)}
.sec-h+.day{margin-top:0}
.day-h{display:flex;align-items:center;gap:14px;width:100%;padding:16px 0;min-height:76px}
.day-id{width:44px;height:44px;border-radius:14px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex:none}
.day.open .day-id{background:var(--ink);color:var(--bg)}
.day-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.day-t b{font-size:20px;font-weight:700;letter-spacing:-.035em;line-height:1.25}
.day-t b small{font-size:13.5px;font-weight:600;color:var(--ink2);letter-spacing:-.02em}
.day-t>small{font-size:12.5px;color:var(--ink2)}
.chev{color:var(--ink3);transition:transform .25s var(--ease);display:flex}
.chev svg{width:20px;height:20px}
.day.open .chev,details[open]>summary .chev{transform:rotate(180deg)}
.day-b{padding:0 0 20px}
.ex-list li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px dashed var(--line)}
.ex-list li>.mono:first-child{width:22px;flex:none}
.ex-li{flex:1;min-width:0;display:flex;flex-direction:column}
.ex-li b{font-size:15px}.ex-li small{font-size:12.5px;color:var(--ink2)}
.ex-list+.btn{margin-top:16px}
.tag{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.09em;font-weight:500;padding:2px 6px 1px;border-radius:5px;box-shadow:inset 0 0 0 1px var(--line2);color:var(--ink2);vertical-align:2px;margin-left:4px}
.kv li{display:grid;grid-template-columns:86px 1fr;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.kv b{font-size:14px}.kv span{font-size:14px;color:var(--ink2);line-height:1.55}
.prog{height:4px;border-radius:2px;background:var(--line2);overflow:hidden;margin:16px 0 10px}
.prog i{display:block;height:100%;background:var(--acc);transform-origin:left;transition:transform .35s var(--ease)}
.live-t{color:var(--ink);font-size:13px}
.ex{margin:0 var(--pad);padding:22px 0 20px;border-top:1px solid var(--line);scroll-margin-top:calc(60px + var(--sat))}
.page-h.sess+.ex,.note.box+.ex{margin-top:24px}
.ex-h{display:flex;align-items:flex-start;gap:10px}
.ex-h>.mono:first-child{width:20px;flex:none;padding-top:5px}
.ex-h>.mono:last-child{padding-top:5px;white-space:nowrap}
.ex-t{flex:1;min-width:0}
.ex-t h3{font-size:19px;letter-spacing:-.035em;line-height:1.25}
.ex-t small{font-size:12.5px;color:var(--ink2)}
.hint{font-size:12.5px;line-height:1.5;color:var(--ink2);margin:8px 0 14px 30px}
.hint.up{color:var(--acc);font-weight:600}
.sets{display:grid;gap:8px}
.set{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1.3fr) 48px;gap:8px;align-items:center}
.set-n{color:var(--ink3);text-align:center}
.num-f,.stepper,.set-bw{height:48px;border-radius:14px;background:var(--bg2)}
.num-f{display:flex;align-items:center;padding:0 12px;gap:4px}
.num-f input,.stepper input{font-family:var(--mono);font-size:18px;font-weight:500;letter-spacing:-.02em;text-align:center;width:100%;height:100%}
.num-f span,.stepper label span{font-size:11.5px;color:var(--ink3);flex:none}
.set-bw{display:flex;align-items:center;justify-content:center;background:none;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink3)}
.stepper{display:grid;grid-template-columns:40px minmax(0,1fr) 40px}

.stepper button svg{width:17px;height:17px}
.stepper label{display:flex;align-items:center;justify-content:center;gap:3px;min-width:0}
.stepper label input{width:2.6ch;flex:none}
.set.done .num-f,.set.done .stepper,.set.done .set-bw{opacity:.42}
.ex.fin .ex-t h3{color:var(--ink2)}
.ex-f{display:flex;flex-wrap:wrap;gap:4px 18px;margin:10px 0 0 30px}
.ex-f button,.ex-f a{font-size:13px;font-weight:600;color:var(--ink2);height:36px;display:inline-flex;align-items:center}
.cues{margin-top:10px;padding:14px 16px;border-radius:16px;background:var(--bg2)}
.cues ol{list-style:decimal;padding-left:18px;display:grid;gap:6px;font-size:14px;line-height:1.5}
.cues ol li::marker{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.cues .meta{font-family:var(--mono);font-size:11px;color:var(--ink3);letter-spacing:.02em}
.cues .miss{font-size:13px;color:var(--ink2);margin:10px 0 8px}.cues .miss b{color:var(--warn);margin-right:4px}
.sess-end{padding:28px var(--pad) 0;display:grid;gap:6px;border-top:1px solid var(--line);margin-top:4px}
#rest{position:fixed;left:12px;right:12px;bottom:calc(var(--nav) + var(--sab) + 10px);z-index:40;max-width:496px;margin:0 auto;border-radius:20px;overflow:hidden;background:var(--volt);color:var(--on-volt);transform:translateY(calc(100% + 110px));transition:transform .35s var(--ease),background .2s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#rest.on{transform:none;pointer-events:auto}
#rest.go{background:var(--ink);color:var(--bg)}
.rest-bar{height:3px;background:rgba(11,11,12,.16)}
.rest-bar i{display:block;height:100%;background:currentColor;transform-origin:left;transition:transform .25s linear}
.rest-row{display:flex;align-items:center;gap:8px;padding:9px 8px 9px 16px}
.rest-t{font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:-.03em;min-width:66px}
.rest-l{flex:1;min-width:0;font-size:12.5px;font-weight:600;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rest-row button{height:40px;min-width:44px;padding:0 9px;border-radius:12px;background:rgba(11,11,12,.1);font-family:var(--mono);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
.rest-row button svg{width:18px;height:18px}
#rest.go .rest-row button{background:rgba(128,128,128,.22)}

/* ---------- fuel ---------- */
.big-num{display:flex;align-items:baseline;gap:8px}
.big-num b{font-size:76px;font-weight:600;letter-spacing:-.06em;line-height:1;margin-left:-3px}
.big-num span{font-size:14px;color:var(--ink2);font-weight:500}
.macro{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}
.macro-i{display:grid;gap:5px}
.macro-i b{font-size:27px;font-weight:600;letter-spacing:-.04em;line-height:1.1}
.macro-i b small{font-size:13px;color:var(--ink2);font-weight:500;margin-left:2px;letter-spacing:0}
.bar{height:3px;border-radius:2px;background:var(--line2);overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;background:var(--ink)}
.macro-i:first-child .bar i{background:var(--acc)}
.flow li{display:grid;grid-template-columns:50px minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.flow li>.mono:first-child{font-size:12px;letter-spacing:0;color:var(--ink2)}
.flow-m{display:flex;flex-direction:column;min-width:0}
.flow-m b{font-size:15px}.flow-m small{font-size:12.5px;color:var(--ink2);line-height:1.45}
.flow li.gym{color:var(--acc)}.flow li.gym>.mono:first-child,.flow li.gym small{color:inherit}
.flow li.gym small{opacity:.7}
.acc{border-bottom:1px solid var(--line)}
.acc summary{display:flex;align-items:center;gap:10px;min-height:58px;padding:10px 0;cursor:pointer;list-style:none;-webkit-user-select:none;user-select:none}
.acc summary::-webkit-details-marker{display:none}
.acc summary b{flex:1;font-size:16px;line-height:1.4}
.acc>.note{margin:0 0 14px}
.acc>.note+.opt{margin-top:-4px}
.opt{padding-bottom:12px}
.opt li{display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:10px 0;border-top:1px dashed var(--line)}
.opt li>span:first-child{font-size:14px;line-height:1.5}
.opt li>.mono{white-space:nowrap;letter-spacing:.02em}
.opt.solo{padding-bottom:0}.opt.solo li:first-child{border-top:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.grid2 li{display:grid;gap:3px;padding:14px;border-radius:18px;background:var(--bg2);align-content:start}
.grid2 b{font-size:18px;letter-spacing:-.03em}.grid2 small{font-size:12.5px;color:var(--ink2);line-height:1.45}
.light{padding-left:14px;border-left:3px solid var(--ink3)}
.light+.light{margin-top:18px}
.light.go{border-color:var(--go)}.light.slow{border-color:var(--slow)}.light.stop{border-color:var(--warn)}
.light-h{display:flex;align-items:baseline;gap:10px}
.light.go .mono{color:var(--go)}.light.slow .mono{color:var(--slow)}.light.stop .mono{color:var(--warn)}
.light-h small{font-size:12.5px;color:var(--ink2)}
.light p{font-size:14.5px;line-height:1.75;margin-top:4px}
.light p i{font-style:normal;color:var(--ink3);margin:0 3px}
.light p span{white-space:nowrap}
.num{counter-reset:n}
.num li{counter-increment:n;display:grid;grid-template-columns:30px 1fr;padding:13px 0;border-bottom:1px solid var(--line)}
.num li::before{content:counter(n,decimal-leading-zero);font-family:var(--mono);font-size:11px;color:var(--ink3);grid-row:span 2;padding-top:4px}
.num b{font-size:15px;line-height:1.4}.num small{font-size:13px;color:var(--ink2);line-height:1.5;grid-column:2}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chips.static .chip{color:var(--ink)}

/* ---------- log ---------- */
.chart{margin-top:16px;padding:12px 8px 6px;border-radius:22px;background:var(--bg2)}
.chart.empty{padding:34px 18px;text-align:center;color:var(--ink3);font-size:13.5px}
.chart svg{width:100%;height:auto;overflow:visible}
.chart .raw{fill:none;stroke:var(--ink3);stroke-width:1;stroke-linejoin:round}
.chart .dot{fill:var(--ink3)}
.chart .avg{fill:none;stroke:var(--acc);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chart .now{fill:var(--acc)}
.chart .goal{stroke:var(--line2);stroke-width:1;stroke-dasharray:3 4}
.chart .lab{font-family:var(--mono);font-size:8px;fill:var(--ink3);letter-spacing:.04em}
.hm{display:grid;gap:5px}
.hm-r{display:grid;grid-template-columns:22px repeat(7,1fr);gap:5px;align-items:center}
.hm-r.head span{text-align:center}
.hm-r i{position:relative;height:20px;border-radius:6px;background:var(--bg2)}
.hm-r i.f{background:none;box-shadow:inset 0 0 0 1px var(--line)}
.hm-r i.w{background:var(--volt);box-shadow:none}
.hm-r i.m::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--ink)}
.hm-r i.w.m::after{background:var(--on-volt)}
.hm-r i.t{outline:1.5px solid var(--ink);outline-offset:1.5px}
.legend{display:flex;gap:16px;margin-top:14px;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{position:relative;width:16px;height:12px;border-radius:4px;background:var(--bg2);display:inline-block}
.legend i.w{background:var(--volt)}
.legend i.m::after{content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;background:var(--ink)}
.legend i.w.m::after{background:var(--on-volt)}
.legend i.d{width:8px;height:8px;border-radius:50%;background:none;box-shadow:inset 0 0 0 1.5px var(--ink3)}
.legend i.d.on{background:var(--ink);box-shadow:none}

/* ---------- plan ---------- */
.road li{position:relative;display:grid;grid-template-columns:70px 1fr;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
.road li>.mono{padding-top:5px;color:var(--ink2)}
.road b{font-size:19px;letter-spacing:-.035em}
.road b em{font-style:normal;color:var(--ink3);margin-left:6px;font-size:10px}
.road small{display:block;font-size:13.5px;color:var(--ink2);line-height:1.55;margin-top:3px}
.road li.past{opacity:.45}
.road li.now>.mono{color:var(--acc)}
.road li.now::before{content:"";position:absolute;left:calc(var(--pad) * -1);top:16px;bottom:16px;width:3px;background:var(--acc);border-radius:0 2px 2px 0}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wk-d{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 2px 9px;border-radius:14px;background:var(--bg2);min-height:98px}
.wk-d b{font-size:20px;font-weight:700;line-height:1.15}
.wk-d small{font-size:9.5px;line-height:1.25;color:var(--ink2);text-align:center;letter-spacing:-.03em;word-break:keep-all;flex:1}
.wk-d i{width:7px;height:7px;border-radius:50%;box-shadow:inset 0 0 0 1.5px currentColor;opacity:.4}
.wk-d i.on{background:currentColor;opacity:1}
.wk-d.gym{background:var(--volt);color:var(--on-volt)}
.wk-d.gym small{color:inherit;opacity:.7}
.src li{border-bottom:1px solid var(--line)}
.src a{display:flex;flex-direction:column;gap:2px;padding:13px 0}
.src b{font-size:14.5px}.src small{font-size:13px;color:var(--ink2)}
.set-g{margin-top:26px}
.set-g>.set-t{display:block;margin-bottom:6px}
.set-r{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:54px;padding:8px 0;border-bottom:1px solid var(--line)}
.set-r.col{flex-direction:column;align-items:stretch;gap:10px;padding:12px 0 14px}
.set-l{display:flex;flex-direction:column;min-width:0}
.set-l b{font-size:15px;font-weight:600}.set-l small{font-size:12.5px;color:var(--ink2);line-height:1.45}
.set-in{display:flex;align-items:center;gap:7px;flex:none}
.set-in input{width:118px;height:40px;padding:0 11px;border-radius:11px;background:var(--bg2);font-family:var(--mono);font-size:16px;text-align:right}
.set-in input[type=date]{width:158px;min-height:40px;text-align:center}
.set-in em{font-style:normal;font-size:12px;color:var(--ink3);min-width:26px}
.sw{position:relative;width:50px;height:30px;border-radius:999px;background:var(--bg3);flex:none;transition:background .2s}
.sw i{position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:var(--ink2);transition:transform .22s var(--ease),background .2s}
.sw.on{background:var(--volt)}.sw.on i{transform:translateX(20px);background:var(--on-volt)}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow button{height:42px;border-radius:12px;background:var(--bg2);font-size:14px;font-weight:650;color:var(--ink2);text-align:center}
.dow button.on{background:var(--ink);color:var(--bg)}
.foot{text-align:center;margin-top:44px}

/* ---------- sheet ---------- */
#sheet-root{position:fixed;inset:0;z-index:60;pointer-events:none;display:flex;align-items:flex-end;justify-content:center;padding-bottom:var(--kb,0px);transition:padding-bottom .2s var(--ease)}
#sheet-root:empty{display:none}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.62);opacity:0;transition:opacity .25s}
.sheet{position:relative;width:100%;max-width:520px;max-height:calc(92vh - var(--kb,0px));max-height:calc(92dvh - var(--kb,0px));overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--bg2);border-radius:28px 28px 0 0;padding:8px var(--pad) calc(22px + var(--sab));transform:translateY(102%);transition:transform .32s var(--ease)}
[data-theme="light"] .sheet{background:var(--bg)}
#sheet-root.on{pointer-events:auto}
#sheet-root.on .backdrop{opacity:1}
#sheet-root.on .sheet{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line2);margin:4px auto 16px;cursor:pointer}
.sheet-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px}
.sheet-h h2{font-size:28px;margin-top:4px}
.sheet .dim{line-height:1.55}
.sheet .rows{margin-top:8px}
.sheet textarea{display:block;width:100%;margin-top:12px;padding:14px 16px;border-radius:18px;background:var(--bg3);font-size:16px;line-height:1.5;resize:none}
.sheet textarea::placeholder,.sheet input::placeholder{color:var(--ink3)}
.time input{height:40px;min-width:104px;padding:0 12px;border-radius:12px;background:var(--bg3);font-family:var(--mono);font-size:16px;text-align:center}
.sheet .chip{height:32px}
.sheet .seg{background:var(--bg3)}
.photo{position:relative;margin-top:12px}
.photo:empty{display:none}
.photo img{display:block;width:100%;max-height:240px;object-fit:cover;border-radius:18px;background:var(--bg3)}
.photo-x{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center}
.photo-x svg{width:18px;height:18px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 12px}
.big-field{display:grid;gap:2px;padding:14px 16px 12px;border-radius:20px;background:var(--bg3)}
.big-field input{width:100%;font-size:36px;font-weight:600;letter-spacing:-.045em;line-height:1.15}
.big-field span{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--ink2)}
.steps{list-style:decimal;padding-left:20px;display:grid;gap:5px;font-size:14px;color:var(--ink2);line-height:1.5}
.steps b{color:var(--ink)}
.steps .mono,.sheet p .mono{text-transform:none;letter-spacing:0;font-size:12px}
.pre{margin-top:14px;padding:13px 15px;border-radius:16px;background:var(--bg3);font-family:var(--mono);font-size:11.5px;line-height:1.65;letter-spacing:0;white-space:pre-wrap;word-break:break-word;max-height:176px;overflow:auto;-webkit-user-select:text;user-select:text}
.pre.tall{max-height:300px}
.mini-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:10px}
.mini-field{display:grid;gap:1px;padding:9px 9px 7px;border-radius:13px;background:var(--bg3);min-width:0}
.mini-field .mono{font-size:9px;letter-spacing:.06em}
.mini-field input{width:100%;font-family:var(--mono);font-size:16px;font-weight:500}
.sum{padding-top:6px}
.sum h2{font-size:44px;letter-spacing:-.055em;margin-top:10px}
.sum>.mono{color:var(--acc)}
.prs{margin-top:18px;border-top:1px solid var(--line)}
.prs li{display:flex;align-items:baseline;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.prs .mono{color:var(--acc);font-size:9.5px}.prs b{flex:1;font-size:15px}.prs em{font-style:normal;font-family:var(--mono);font-size:13px}
.rec{margin-top:16px}
.rec li{display:grid;gap:4px;padding:12px 0;border-top:1px solid var(--line)}
.rec b{font-size:15px}.rec .mono{font-size:12px;letter-spacing:0;text-transform:none;white-space:pre-wrap}

/* ---------- setup ---------- */
body.setup #nav,body.setup #top-meta{display:none}
body.setup #app{padding-bottom:calc(var(--sab) + 40px)}
.line-f{display:flex;flex-direction:column;gap:2px;margin-top:16px;padding:14px 16px 12px;border-radius:20px;background:var(--bg2)}
.line-f input{width:100%;font-size:26px;font-weight:650;letter-spacing:-.035em;line-height:1.3}
.line-f input::placeholder,.big-field input::placeholder,.set-in input::placeholder{color:var(--ink3);font-weight:500}
.field-row.three{grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 0}
.field-row.three .big-field{background:var(--bg2);padding:14px 12px 12px;min-width:0}
.field-row.three .big-field input{font-size:clamp(21px,7vw,30px)}
.field-row.three .big-field span{white-space:nowrap}
.optcs{display:grid;gap:8px;margin:16px 0 6px}
.optc{display:flex;align-items:center;gap:13px;width:100%;padding:14px 15px;border-radius:18px;box-shadow:inset 0 0 0 1px var(--line2);transition:background .15s,box-shadow .15s}
.optc>span:last-child{display:flex;flex-direction:column;min-width:0}
.optc b{font-size:16px;letter-spacing:-.02em}.optc small{font-size:12.5px;color:var(--ink2);line-height:1.45}
.optc.on{background:var(--bg2);box-shadow:inset 0 0 0 1.5px var(--acc)}
.seg.wide{display:flex;width:100%}
.seg.wide button{flex:1;height:36px;text-align:center}
.note.center{text-align:center}
.btn.file.slim{height:44px;font-size:13.5px;font-weight:600;color:var(--ink2);box-shadow:none;margin-top:2px}
.kv.tight{margin-top:18px;border-top:1px solid var(--line)}
.kv.tight li{grid-template-columns:52px 1fr;padding:11px 0}
.sum .big-num{margin-top:18px}.sum .big-num b{font-size:64px}
.sum .stats{margin-top:14px}

@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.18)}}
@keyframes blink{50%{opacity:.25}}
@media (max-width:359px){:root{--pad:16px}.field-row.three{gap:6px}.field-row.three .big-field{padding:12px 9px 10px}.line-f input{font-size:22px}.cta-title{font-size:40px}.page-h h1{font-size:48px}.stats.line b{font-size:18px}.set{grid-template-columns:18px minmax(0,1fr) minmax(0,1.35fr) 44px;gap:6px}.stepper{grid-template-columns:34px minmax(0,1fr) 34px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

</style>
</head>
<body>
<div id="app">
  <header id="top">
    <button class="brand" data-act="go" data-tab="today" aria-label="SMPS 홈">SMPS</button>
    <button class="mono" id="top-meta" data-act="top" aria-label="현재 주차"></button>
  </header>
  <main id="view"></main>
</div>
<div id="rest" role="timer" aria-live="off"></div>
<nav id="nav" aria-label="메뉴"><div>
  <button data-act="go" data-tab="today">TODAY</button>
  <button data-act="go" data-tab="train">TRAIN</button>
  <button data-act="go" data-tab="fuel">FUEL</button>
  <button data-act="go" data-tab="log">LOG</button>
  <button data-act="go" data-tab="plan">PLAN</button>
</div></nav>
<div id="sheet-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:40px 20px;color:#F4F3EE;font-family:sans-serif">이 앱은 자바스크립트가 켜져 있어야 동작해.</p></noscript>
<script>
'use strict';
/* ============================================================
   SMPS — 프로그램 & 콘텐츠 데이터
   숫자나 종목을 바꾸고 싶으면 이 블록만 고치면 됨.
   ============================================================ */
const APP = { name: 'SMPS', ver: '1.2', key: 'smps.v1', oldKeys: ['rokfit.v1'] };

/* 개인 정보(이름 · 키 · 체중 · 나이)는 코드에 두지 않는다. 처음 열 때 각자 입력하고, 그 폰에만 저장된다. */
const DEFAULTS = {
  profile: { name: '', partner: '', height: '', startWeight: '', age: '', startDate: '', goalWeight: '', goal: 'recomp', level: 'novice' },
  settings: {
    theme: 'dark', gymTime: '19:30', gymDays: [1, 3, 4], dietDays: [1, 2, 3, 4],
    legs: true, bonus: true, sound: true,
    kcal: 1800, protein: 130, carb: 210, fat: 50, water: 8
  }
};

/* 목표별 설정 — delta: 유지 칼로리 대비 kcal · p, f: 체중 1kg당 g · gw: 12주 1차 목표 체중 변화율 */
const GOALS = {
  cut: { name: '감량 우선', short: '감량', en: 'CUT', d: '체중과 뱃살부터 줄인다. 칼로리를 조금 더 타이트하게.',

const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = String(k).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const todayKey = () => keyOf(new Date());
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
const diffDays = (a, b) => Math.round((parseKey(a) - parseKey(b)) / 864e5);
const DOW_KO = ['일', '월', '화', '수', '목', '금', '토'];
const DOW_EN = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
const weekStart = k => { const d = parseKey(k); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return keyOf(d); };
const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const md = k => { const d = parseKey(k); return `${pad(d.getMonth() + 1)}.${pad(d.getDate())}`; };

const num = v => { const n = parseFloat(String(v == null ? '' : v).replace(',', '.')); return isFinite(n) ? n : 0; };
const fmtKg = n => { const v = Math.round(num(n) * 100) / 100; return String(v); };
const fmtInt = n => Math.round(num(n)).toLocaleString('en-US');
const mmss = s => { s = Math.max(0, Math.round(s)); return `${Math.floor(s / 60)}:${pad(s % 60)}`; };
const hms = ms => { const s = Math.max(0, Math.floor(ms / 1000)); const h = Math.floor(s / 3600); return (h ? pad(h) + ':' : '') + pad(Math.floor((s % 3600) / 60)) + ':' + pad(s % 60); };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

const Store = (() => {
  const mem = {};

  try { const k = '__smps_t'; window.localStorage.setItem(k, '1'); window.localStorage.removeItem(k); ok = true; } catch (e) { ok = false; }
  return {
    persistent: ok,

})();

function nextMonday() { const d = new Date(); d.setDate(d.getDate() + ((8 - d.getDay()) % 7)); return keyOf(d); }
function freshState() {
  return {
    v: 1,
    profile: { ...DEFAULTS.profile, startDate: nextMonday() },
    settings: { ...DEFAULTS.settings, gymDays: [...DEFAULTS.settings.gymDays], dietDays: [...DEFAULTS.settings.dietDays] },
    days: {}, workouts: [], active: null, swap: {}, prep: {}, flags: {}
  };
}
function mergeState(base, s) {
  if (!s || typeof s !== 'object') return base;
  Object.assign(base.profile, s.profile || {});
  Object.assign(base.settings, s.settings || {});
  if (!GOALS[base.profile.goal]) base.profile.goal = 'recomp';
  if (!LEVELS[base.profile.level]) base.profile.level = 'novice';
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(base.profile.startDate || ''))) base.profile.startDate = nextMonday();
  if (!Array.isArray(base.settings.gymDays)) base.settings.gymDays = [...DEFAULTS.settings.gymDays];
  if (!Array.isArray(base.settings.dietDays)) base.settings.dietDays = [...DEFAULTS.settings.dietDays];
  if (s.days && typeof s.days === 'object') base.days = s.days;
  if (Array.isArray(s.workouts)) base.workouts = s.workouts.filter(w => w && PROGRAM[w.day] && Array.isArray(w.items));
  base.active = s.active && PROGRAM[s.active.day] && Array.isArray(s.active.items) ? s.active : null;
  if (base.active) { base.active.items = base.active.items.filter(it => it && slotById(it.slot) && EX[it.ex] && Array.isArray(it.sets)); if (!base.active.items.length) base.active = null; }
  base.swap = s.swap || {}; base.prep = s.prep || {}; base.flags = s.flags || {};
  /* 예전 백업(설정 플래그가 없던 버전)을 불러와도 프로필이 채워져 있으면 설정 완료로 본다 */
  const pf = base.profile;
  if (!base.flags.setup && String(pf.name || '').trim() && num(pf.height) && num(pf.startWeight) && num(pf.age) && (base.workouts.length || Object.keys(base.days).length)) base.flags.setup = true;
  return base;
}
function loadState() {
  let s = null;
  try { s = JSON.parse(Store.get(APP.key) || 'null'); } catch (e) { s = null; }

  if (!s) for (const k of APP.oldKeys || []) { try { s = JSON.parse(Store.get(k) || 'null'); } catch (e) { s = null; } if (s) break; }

const Photos = (() => {
  const mem = new Map(), urls = new Map();
  let ready = null;
  function open() {
    if (ready) return ready;
    ready = new Promise(res => {
      try {
        const rq = window.indexedDB.open('smps', 1);
        rq.onupgradeneeded = () => { try { rq.result.createObjectStore('photos'); } catch (e) {} };
        rq.onsuccess = () => res(rq.result);
        rq.onerror = () => res(null);
        rq.onblocked = () => res(null);
      } catch (e) { res(null); }
    });
    return ready;
  }
  function tx(mode, fn) {
    return open().then(db => new Promise(res => {
      if (!db) return res(null);
      try {
        const t = db.transaction('photos', mode), st = t.objectStore('photos');
        const rq = fn(st);
        t.oncomplete = () => res(rq && rq.result !== undefined ? rq.result : true);
        t.onerror = t.onabort = () => res(null);
      } catch (e) { res(null); }
    }));
  }
  return {
    async put(id, blob) { mem.set(id, blob); if (urls.has(id)) { URL.revokeObjectURL(urls.get(id)); urls.delete(id); } await tx('readwrite', st => st.put(blob, id)); },
    async get(id) { if (mem.has(id)) return mem.get(id); const b = await tx('readonly', st => st.get(id)); if (b && b !== true) { mem.set(id, b); return b; } return null; },
    async del(id) { mem.delete(id); if (urls.has(id)) { URL.revokeObjectURL(urls.get(id)); urls.delete(id); } await tx('readwrite', st => st.delete(id)); },
    async clear() { mem.clear(); urls.forEach(u => URL.revokeObjectURL(u)); urls.clear(); await tx('readwrite', st => st.clear()); },
    async url(id) { if (urls.has(id)) return urls.get(id); const b = await this.get(id); if (!b) return null; const u = URL.createObjectURL(b); urls.set(id, u); return u; },
    cached(id) { return mem.get(id) || null; }
  };
})();

function compressImage(file, max = 1280, q = 0.8) {
  return new Promise((resolve, reject) => {
    const src = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      try {
        const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.max(1, Math.round(img.naturalWidth * s)), h = Math.max(1, Math.round(img.naturalHeight * s));
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(src);
        c.toBlob(b => (b ? resolve(b) : reject(new Error('encode'))), 'image/jpeg', q);
      } catch (e) { URL.revokeObjectURL(src); reject(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(src); reject(new Error('decode')); };
    img.src = src;
  });
}

function phaseOf(week) { const w = Math.max(1, week), L = phaseList(); return L.find(p => w >= p.from && w <= p.to) || L[L.length - 1]; }
const cleanName = v => { const s = String(v || '').trim().slice(0, 12); return /^[\x20-\x7E]+$/.test(s) ? s.toUpperCase() : s; };

function dayName(id) { return id === 'B' ? (S.settings.legs ? '어깨 + 하체' : '어깨') : PROGRAM[id].name; }

function slotsFor(id) { return PROGRAM[id].slots.filter(s => (S.settings.bonus || !s.bonus) && (S.settings.legs || !s.leg)); }
function slotById(id) { for (const d of Object.values(PROGRAM)) { const s = d.slots.find(x => x.id === id); if (s) return s; } return null; }
function exFor(slot) { const id = S.swap[slot.id]; return id && EX[id] && (id === slot.ex || slot.alts.includes(id)) ? id : slot.ex; }
function setsFor(slot, phaseN) { if (slot.bonus) return phaseN === 1 ? 1 : 2; if (phaseN === 1) return 2; if (phaseN === 3 && slot.lead) return 4; return 3; }
function unitOf(exId) { return EX[exId] && EX[exId].unit === 'sec' ? '초' : '회'; }
function repRange(slot, exId) { return EX[exId] && EX[exId].unit === 'sec' ? [30, 45] : (slot.reps[1] > 20 ? [12, 15] : slot.reps); }
function dayStats(id, phaseN) {
  const sl = slotsFor(id); let sets = 0, sec = 480;
  for (const s of sl) { const n = setsFor(s, phaseN); sets += n; sec += n * (45 + s.rest) + 120; }
  return { n: sl.length, sets, mins: Math.round((sec / 60) * 1.1 / 5) * 5 };
}

function workoutsOn(k) { return S.workouts.filter(w => w.date === k); }
function workoutsInWeek(k) { const a = weekStart(k), b = addDays(a, 7); return S.workouts.filter(w => w.date >= a && w.date < b); }
function weekGoal() { return clamp(S.settings.gymDays.length || 3, 1, 7); }
function nextDayId() { const o = ['A', 'B', 'C']; const lw = S.workouts[S.workouts.length - 1]; return lw ? o[(o.indexOf(lw.day) + 1) % 3] : 'A'; }
function isGymDay(k) { return S.settings.gymDays.includes(parseKey(k).getDay()); }
function isDietDay(k) { return S.settings.dietDays.includes(parseKey(k).getDay()); }
function nextGymDate(from) { for (let i = 1; i <= 7; i++) { const k = addDays(from, i); if (isGymDay(k)) return k; } return null; }

function lastSets(slotId, exId) {
  const hit = pred => { for (let i = S.workouts.length - 1; i >= 0; i--) { const it = S.workouts[i].items.find(pred); if (it && it.sets.length) return it.sets; } return null; };
  return hit(x => x.slot === slotId && x.ex === exId) || hit(x => x.ex === exId);
}
function suggest(slot, exId) {
  const def = EX[exId], [lo, hi] = repRange(slot, exId), unit = unitOf(exId);
  const last = lastSets(slot.id, exId);
  const base = def.unit === 'sec' ? lo : Math.floor((lo + hi) / 2);
  if (!last) return { w: '', r: base, kind: 'first', note: `첫 기록 · ${def.start}` };
  const reps = last.map(s => num(s.r)), allTop = reps.every(r => r >= hi), rs = reps.join('·');
  if (def.bw) {
    return allTop
      ? { w: '', r: hi, reps, kind: 'up', note: `지난번 ${rs}${unit} · 상단 달성. 더 천천히, 또는 +2${unit}` }
      : { w: '', r: base, reps, kind: 'same', note: `지난번 ${rs}${unit} · 오늘은 세트마다 +1` };
  }
  const ws = last.map(s => num(s.w)), top = def.assist ? Math.min(...ws) : Math.max(...ws), inc = def.inc || 2.5;
  if (allTop && top > 0) {
    const nw = def.assist ? Math.max(0, top - inc) : top + inc;
    return { w: fmtKg(nw), r: lo, kind: 'up', note: `지난번 ${fmtKg(top)}kg × ${rs} · 상단 달성. 오늘 ${fmtKg(nw)}kg${def.assist ? '(보조 줄이기)' : ''}` };
  }
  return { w: top ? fmtKg(top) : '', r: base, reps, kind: 'same', note: `지난번 ${fmtKg(top)}kg × ${rs} · 같은 무게로 1회 더` };
}
function buildItem(slot, phaseN, exId) {
  const ex = exId || exFor(slot), sg = suggest(slot, ex), n = setsFor(slot, phaseN), sets = [];
  for (let j = 0; j < n; j++) sets.push({ w: sg.w, r: sg.reps ? sg.reps[Math.min(j, sg.reps.length - 1)] : sg.r, done: false });
  return { slot: slot.id, ex, sets, note: sg.note, kind: sg.kind };
}
function sumWorkout(w) {
  let sets = 0, vol = 0;
  for (const it of w.items) for (const s of it.sets) { if (s.done === false) continue; sets++; if (!(EX[it.ex] || {}).bw && !(EX[it.ex] || {}).assist) vol += num(s.w) * num(s.r); }
  return { sets, vol: Math.round(vol), mins: Math.max(1, Math.round(((w.end || Date.now()) - w.start) / 60000)) };
}
function bestWeight(exId, beforeStart) {
  let best = 0;
  for (const w of S.workouts) { if (beforeStart && w.start >= beforeStart) continue; for (const it of w.items) if (it.ex === exId) for (const s of it.sets) best = Math.max(best, num(s.w)); }
  return best;
}

    [[0, 880], [0.2, 1175]].forEach(([d, f]) => {

      g.gain.setValueAtTime(0.0001, t + d); g.gain.exponentialRampToValueAtTime(0.2, t + d + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.17);

  } catch (e) {}
}

const Rest = {
  end: 0, total: 0, timer: 0, fired: false, label: '',

/* ============================================================
   TRAIN

function repText(slot, exId) { const [lo, hi] = repRange(slot, exId); return `${lo}–${hi}${unitOf(exId) === '초' ? '초' : ''}`; }
function dayCard(id, next, ph) {

}
function historyList() {

    return `<li><button class="row" data-act="w-detail" data-id="${esc(w.id)}"><span class="row-at mono">${md(w.date)}<br>${DOW_EN[d.getDay()]}</span>
      <span class="row-main"><b>${esc(dayName(w.day))}</b><small>${s.mins}분 · ${s.sets}세트 · ${fmtInt(s.vol)}kg</small></span><span class="row-end">${I.right}</span></button></li>`; }).join('')}</ul>`;
}
function viewTrain() {

  return `<section class="page-h"><span class="mono dim">PHASE ${ph.n} · ${ph.en}${wk ? ` · WEEK ${wk}` : ''}</span><h1>운동</h1><p class="dim">${ph.desc}</p></section>
    <section class="sec"><div class="sec-h"><span class="mono">3 SPLIT</span><span class="mono dim">이번 주 ${cnt}/${weekGoal()}</span></div>

        <li><b>무게</b><span>15개쯤 할 수 있는 무게로 시작. 목표 횟수 상단을 전 세트 채우면 다음 번에 증량.</span></li>

}

/* ---------- 진행 중 세션 ---------- */
function setRow(it, i, j) {
  const s = it.sets[j], def = EX[it.ex], sec = def.unit === 'sec', step = sec ? 5 : 1;
  return `<div class="set ${s.done ? 'done' : ''}">
    <span class="set-n mono">${j + 1}</span>
    ${def.bw ? `<span class="set-bw mono">맨몸</span>` : `<label class="num-f"><input inputmode="decimal" enterkeyhint="done" autocomplete="off" value="${esc(s.w)}" placeholder="—" data-in="w" data-ch="w" data-i="${i}" data-j="${j}" aria-label="${j + 1}세트 무게"><span>kg</span></label>`}
    <div class="stepper"><button data-act="rep" data-i="${i}" data-j="${j}" data-d="${-step}" aria-label="줄이기">${I.minus}</button>
      <label><input inputmode="numeric" enterkeyhint="done" autocomplete="off" value="${esc(s.r)}" data-in="r" data-i="${i}" data-j="${j}" aria-label="${j + 1}세트 횟수"><span>${sec ? '초' : '회'}</span></label>
      <button data-act="rep" data-i="${i}" data-j="${j}" data-d="${step}" aria-label="늘리기">${I.plus}</button></div>
    <button class="tick big ${s.done ? 'on' : ''}" data-act="set" data-i="${i}" data-j="${j}" aria-label="${j + 1}세트 완료" aria-pressed="${!!s.done}">${I.check}</button>
  </div>`;
}
function exBlock(it, i) {
  const slot = slotById(it.slot), def = EX[it.ex], fin = it.sets.length && it.sets.every(s => s.done), open = !!ui.cue[it.slot];
  return `<article class="ex ${fin ? 'fin' : ''}" id="ex-${i}">
    <header class="ex-h"><span class="mono faint">${pad(i + 1)}</span>
      <div class="ex-t"><h3>${esc(def.n)}${slot.bonus ? ' <span class="tag">BONUS</span>' : ''}</h3><small>${esc(slot.why || def.t)}</small></div>
      <span class="mono dim">${it.sets.length} × ${repText(slot, it.ex)}</span></header>
    <p class="hint ${it.kind || ''}">${esc(it.note || '')}</p>
    <div class="sets">${it.sets.map((s, j) => setRow(it, i, j)).join('')}</div>
    <footer class="ex-f"><button data-act="set-add" data-i="${i}">+ 세트</button>${it.sets.length > 1 && !it.sets[it.sets.length - 1].done ? `<button data-act="set-del" data-i="${i}">− 세트</button>` : ''}
      <button data-act="cue" data-i="${i}" aria-expanded="${open}">자세</button><button data-act="swap" data-i="${i}">교체</button>
      <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(def.n + ' 자세')}" target="_blank" rel="noopener noreferrer">영상 ↗</a></footer>
    ${open ? `<div class="cues"><ol>${def.cues.map(c => `<li>${esc(c)}</li>`).join('')}</ol><p class="miss"><b>주의</b> ${esc(def.miss)}</p><p class="meta">휴식 ${mmss(slot.rest)} · 시작 가이드 ${esc(def.start)}</p></div>` : ''}
  </article>`;
}
function sessProgress() { const a = S.active; let tot = 0, dn = 0; a.items.forEach(it => it.sets.forEach(s => { tot++; if (s.done) dn++; })); return { tot, dn }; }
function viewSession() {
  const a = S.active, ph = PHASES.find(x => x.n === a.phase) || PHASES[0], p = sessProgress();
  return `<section class="page-h sess"><div class="hero-row"><span class="mono dim">DAY ${a.day} · PHASE ${ph.n} ${ph.en}</span><span class="mono live-t" data-elapsed>${hms(Date.now() - a.start)}</span></div>
      <h1>${esc(dayName(a.day))}${daySub(a.day) ? ` <small>${esc(daySub(a.day))}</small>` : ''}</h1>
      <div class="prog"><i style="transform:scaleX(${p.tot ? p.dn / p.tot : 0})"></i></div>
      <div class="hero-row"><span class="dim sm" id="sess-count">${p.dn}/${p.tot} 세트</span><span class="dim sm">${a.phase === 1 ? '가볍게 · 3~4개 남기기' : '2~3개 남기고 멈추기'}</span></div></section>
    ${p.dn === 0 ? `<p class="note box">워밍업 먼저 — 5분 걷기 후 첫 종목을 아주 가볍게 15회. 세트를 끝낼 때마다 체크를 누르면 휴식 타이머가 시작돼.</p>` : ''}

function openSwap(i) {

    <p class="dim sm">기구가 붐비거나 불편하면 같은 근육을 쓰는 종목으로 바꿔도 돼. 선택은 다음 운동에도 유지됨.</p>
    <ul class="rows">${[slot.ex, ...slot.alts].map(id => `<li><button class="row ${id === it.ex ? 'sel' : ''}" data-act="swap-pick" data-ex="${id}">
      <span class="row-main"><b>${esc(EX[id].n)}</b><small>${esc(EX[id].t)} · 시작 ${esc(EX[id].start)}</small></span><span class="row-end ${id === it.ex ? 'ok' : ''}">${id === it.ex ? I.check : ''}</span></button></li>`).join('')}</ul>`);
}
function openSummary(w, prs) {

  Sheet.open(`<div class="sum"><span class="mono">WORKOUT COMPLETE</span><h2>${esc(dayName(w.day))} 완료</h2>

    ${prs.length ? `<ul class="prs">${prs.map(p => `<li><span class="mono">NEW BEST</span><b>${esc(EX[p.ex].n)}</b><em>${fmtKg(p.from)} → ${fmtKg(p.to)}kg</em></li>`).join('')}</ul>` : ''}

function openWorkout(id) {

  Sheet.open(`<div class="sheet-h"><div><span class="mono dim">${md(w.date)} ${DOW_EN[d.getDay()]} · DAY ${w.day}</span><h2>${esc(dayName(w.day))}</h2></div></div>
    <div class="stats"><span><b>${s.mins}</b><small>분</small></span><span><b>${s.sets}</b><small>세트</small></span><span><b>${fmtInt(s.vol)}</b><small>kg 볼륨</small></span></div>
    <ul class="rec">${w.items.map(it => { const def = EX[it.ex] || { n: it.ex }, u = unitOf(it.ex);
      return `<li><b>${esc(def.n)}</b><span class="mono dim">${it.sets.map(x => (def.bw ? `${fmtKg(x.r)}${u}` : `${fmtKg(x.w)}×${fmtKg(x.r)}`)).join('  ')}</span></li>`; }).join('')}</ul>
    <div class="btn-col"><button class="btn ghost" data-act="sheet-close">닫기</button><button class="btn ghost danger-t" data-act="w-del">이 기록 삭제</button></div>`);
}

/* ---------- 세션 동작 ---------- */
function startSession(dayId) {
  if (S.active) { go('train'); return; }
  const k = todayKey(), ph = curPhase(k);
  S.active = { id: 'w' + Date.now().toString(36), day: dayId, date: k, start: Date.now(), phase: ph.n, items: slotsFor(dayId).map(s => buildItem(s, ph.n)) };
  ui.pick = null; ui.cue = {}; saveNow(); primeAudio(); wake(true); go('train');
}
function finishSession() {
  const a = S.active; if (!a) return;
  const items = a.items.map(it => ({ slot: it.slot, ex: it.ex, sets: it.sets.filter(s => s.done).map(s => ({ w: num(s.w), r: num(s.r) })) })).filter(it => it.sets.length);
  if (!items.length) { toast('완료한 세트가 없어 — 세트 옆 체크를 눌러줘'); return; }
  /* 앱을 켜둔 채 잊어버린 경우를 대비해, 종료 시각은 마지막 세트 체크 + 5분을 넘기지 않는다 */
  const end = a.last ? Math.min(Date.now(), a.last + 5 * 60000) : Date.now();
  const w = { id: a.id, day: a.day, date: a.date, start: a.start, end: Math.max(end, a.start + 60000), phase: a.phase, items };
  const prs = [];
  for (const it of items) { const def = EX[it.ex]; if (!def || def.bw || def.assist) continue; const prev = bestWeight(it.ex), now = Math.max(...it.sets.map(s => s.w)); if (prev > 0 && now > prev) prs.push({ ex: it.ex, from: prev, to: now }); }
  S.workouts.push(w); S.workouts.sort((x, y) => x.start - y.start); S.active = null; saveNow();
  Rest.stop(); wake(false); ui.day = todayKey(); go('today'); openSummary(w, prs);
}
function abortSession() { S.active = null; saveNow(); Rest.stop(); wake(false); Sheet.close(); go('train'); toast('운동을 종료했어 — 기록은 남기지 않음'); }

function weightChart(series) {
  if (series.length < 2) return `<div class="chart empty"><p>체중을 두 번 이상 기록하면 그래프가 생겨.</p></div>`;
  const W = 320, H = 132, px = 6, pt = 12, pb = 20;
  const first = series[0].k, span = Math.max(1, diffDays(series[series.length - 1].k, first));
  const goal = num(S.profile.goalWeight), ws = series.map(s => s.w);
  let lo = Math.min(...ws, goal || Infinity), hi = Math.max(...ws, goal || -Infinity);

    <path class="avg" d="${line(avg)}"/><circle class="now" cx="${x(last.k).toFixed(1)}" cy="${y(last.w).toFixed(1)}" r="4"/>
    <text class="lab" x="${px}" y="${H - 4}">${md(first)}</text><text class="lab" x="${W - px}" y="${H - 4}" text-anchor="end">${md(series[series.length - 1].k)}</text>
  </svg></div>`;
}
function heatmap() {

    let cells = '';

function liftRows() {
  const seen = new Set(), order = [];
  Object.values(PROGRAM).forEach(d => d.slots.forEach(s => [s.ex, ...s.alts].forEach(e => { if (!seen.has(e)) { seen.add(e); order.push(e); } })));
  const rows = [];
  for (const e of order) {
    const def = EX[e]; if (!def || def.bw) continue;
    const tops = []; S.workouts.forEach(w => w.items.forEach(it => { if (it.ex === e && it.sets.length) tops.push(def.assist ? Math.min(...it.sets.map(s => num(s.w))) : Math.max(...it.sets.map(s => num(s.w)))); }));
    if (!tops.length) continue;
    const a = tops[0], b = tops[tops.length - 1], lo = Math.min(...tops), hi = Math.max(...tops), n = tops.length;
    const pts = tops.map((v, i) => `${(n === 1 ? 30 : (i / (n - 1)) * 60).toFixed(1)},${(hi === lo ? 9 : 16 - ((v - lo) / (hi - lo)) * 14).toFixed(1)}`).join(' ');
    const diff = Math.round((b - a) * 100) / 100;
    rows.push(`<li><div class="row static"><span class="row-main"><b>${esc(def.n)}</b><small>${n}회 기록 · ${fmtKg(a)} → ${fmtKg(b)}kg</small></span>
      <svg class="spark" viewBox="0 0 60 18" aria-hidden="true"><polyline points="${pts}"/></svg>
      <span class="row-val">${fmtKg(b)}<small>kg${diff ? ` · ${diff > 0 ? '+' : '−'}${fmtKg(Math.abs(diff))}` : ''}</small></span></div></li>`);
  }
  return rows.length ? `<ul class="rows">${rows.join('')}</ul>` : `<p class="empty">운동을 기록하면 종목별 무게 변화가 여기에 보여.</p>`;
}

    const key = t.dataset.k, p = S.profile, v = t.value.trim();
    if (key === 'name') { if (cleanName(v)) p.name = cleanName(v); } else if (key === 'partner') p.partner = cleanName(v);
    else if (key === 'startDate') { if (/^\d{4}-\d{2}-\d{2}$/.test(v)) p.startDate = v; }
    else { const n = num(v); if (n > 0) p[key] = n; }
    save(); softRender();
  } else if (k === 'st') {
    const key = t.dataset.k, n = Math.round(num(t.value)); if (n > 0) S.settings[key] = key === 'water' ? clamp(n, 4, 16) : n; save(); softRender();
  } else if (k === 'm-file') pickPhoto(t.files && t.files[0]);
  else if (k === 'import') { importFile(t.files && t.files[0]); t.value = ''; }
});

/* ---------- 수명주기 ---------- */
function rollover() {
  const tk = todayKey(); if (!ui.lastToday || ui.lastToday === tk) return;
  const a = document.activeElement; if (Sheet.isOpen || (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) return;
  if (ui.day === ui.lastToday) ui.day = tk; render();
}
setInterval(() => {
  if (S.active) { const s = hms(Date.now() - S.active.start); $$('[data-elapsed]').forEach(el => { el.textContent = s; }); }
  rollover();
}, 1000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { saveNow(); return; }
  rollover(); if (S.active) wake(true); Rest.draw();
});
window.addEventListener('pagehide', saveNow);
if (mqLight && mqLight.addEventListener) mqLight.addEventListener('change', applyTheme);

/* 키보드가 올라오면 시트를 그 위로 올린다 (iOS · Android 공통) */
if (window.visualViewport) {
  const vv = window.visualViewport, kb = () => { const h = Math.max(0, window.innerHeight - vv.height - vv.offsetTop); document.documentElement.style.setProperty('--kb', (h > 90 ? Math.round(h) : 0) + 'px'); };
  vv.addEventListener('resize', kb); vv.addEventListener('scroll', kb);
}
try { if (Store.persistent && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}

applyTheme();
render();
if (S.active) wake(true);
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {} });
}

</script>
